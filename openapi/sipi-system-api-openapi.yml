openapi: 3.2.0
info:
  title: Sipi System API
  version: 0.1.0
  contact:
    name: sipi.bot
    url: https://sipi.bot
    email: sales@sipiteno.com
  license:
    name: MIT
    url: https://github.com/kindrat86/sipi-bot/blob/main/LICENSE
  termsOfService: https://sipi.bot/terms
  description: 'Operations tagged System across 2 of this provider''s published API definitions: sipi-openapi.json, sipi-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sipi.bot
  description: Production
security:
- BearerAuth: []
tags:
- name: System
  description: Service health and metadata
paths:
  /health:
    get:
      tags:
      - System
      summary: Service health
      operationId: health
      security:
      - {}
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  service:
                    type: string
                  version:
                    type: string
    servers:
    - url: https://sipi.bot
      description: Production
  /.well-known/agent-card.json:
    get:
      tags:
      - System
      summary: Agent card (A2A discovery)
      description: Machine-readable agent card for Agent-to-Agent discovery — name, capabilities, skills, and endpoint URLs.
      operationId: agentCard
      security:
      - {}
      responses:
        '200':
          description: Agent card.
          content:
            application/json:
              schema:
                type: object
    servers:
    - url: https://sipi.bot
      description: Production
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: A checkout-issued or operator-created API key. ADMIN_TOKEN is accepted only for operator control-plane access.
externalDocs:
  description: Agent card (A2A discovery)
  url: https://sipi.bot/.well-known/agent-card.json
x-refined-from:
- sipi-openapi.json
- sipi-openapi.json
