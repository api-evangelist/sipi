openapi: 3.2.0
info:
  title: Sipi Approvals API
  version: 0.1.0
  contact:
    name: sipi.bot
    url: https://sipi.bot
    email: sales@sipiteno.com
  license:
    name: MIT
    url: https://github.com/kindrat86/sipi-bot/blob/main/LICENSE
  termsOfService: https://sipi.bot/terms
  description: 'Operations tagged Approvals across 2 of this provider''s published API definitions: sipi-openapi.json, sipi-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sipi.bot
  description: Production
security:
- BearerAuth: []
tags:
- name: Approvals
  description: Human-in-the-loop approval queue for FLAGGED transactions
paths:
  /api/approvals:
    get:
      tags:
      - Approvals
      summary: List pending approvals
      description: Returns FLAGGED transactions routed to the human-in-the-loop queue.
      operationId: listApprovals
      responses:
        '200':
          description: Pending approvals.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Approval'
    servers:
    - url: https://sipi.bot
      description: Production
  /api/approvals/{approval_id}:
    post:
      tags:
      - Approvals
      summary: Resolve a pending approval
      description: Approve or deny a FLAGGED transaction in the human queue.
      operationId: resolveApproval
      parameters:
      - name: approval_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - deny
                  example: approve
      responses:
        '200':
          description: Resolution result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolved:
                    type: boolean
    servers:
    - url: https://sipi.bot
      description: Production
components:
  schemas:
    Approval:
      type: object
      properties:
        id:
          type: string
        transaction_id:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - denied
        amount:
          type: number
        merchant:
          type: string
        reason:
          type: string
        created_at:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: A checkout-issued or operator-created API key. ADMIN_TOKEN is accepted only for operator control-plane access.
externalDocs:
  description: Agent card (A2A discovery)
  url: https://sipi.bot/.well-known/agent-card.json
x-refined-from:
- sipi-openapi.json
- sipi-openapi.json
