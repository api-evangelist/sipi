openapi: 3.2.0
info:
  title: Sipi Rules API
  version: 0.1.0
  contact:
    name: sipi.bot
    url: https://sipi.bot
    email: sales@sipiteno.com
  license:
    name: MIT
    url: https://github.com/kindrat86/sipi-bot/blob/main/LICENSE
  termsOfService: https://sipi.bot/terms
  description: 'Operations tagged Rules across 2 of this provider''s published API definitions: sipi-openapi.json, sipi-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sipi.bot
  description: Production
security:
- BearerAuth: []
tags:
- name: Rules
  description: Create, list, and delete spend-policy rules
paths:
  /api/rules:
    get:
      tags:
      - Rules
      summary: List all spend rules
      operationId: listRules
      responses:
        '200':
          description: Rules list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
    post:
      tags:
      - Rules
      summary: Add a spend rule
      operationId: addRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
      responses:
        '200':
          description: Created rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
    servers:
    - url: https://sipi.bot
      description: Production
  /api/rules/{rule_id}:
    delete:
      tags:
      - Rules
      summary: Delete a spend rule
      operationId: deleteRule
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Deletion result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
    servers:
    - url: https://sipi.bot
      description: Production
components:
  schemas:
    Decision:
      type: string
      enum:
      - APPROVED
      - BLOCKED
      - FLAGGED
      description: APPROVED = pass all rules. BLOCKED = violates a hard rule, no money moves. FLAGGED = allowed but crosses an approval threshold, routed to the human queue.
    RuleCreate:
      type: object
      required:
      - rule_type
      properties:
        rule_type:
          type: string
          enum:
          - per_transaction
          - daily_total
          - velocity
          - merchant_block
          - merchant_allow
          - category_limit
          - time_window
          - approval_threshold
        params:
          type: object
          description: Rule-type-specific parameters.
          example:
            max_amount: 500
        action:
          $ref: '#/components/schemas/Decision'
          default: BLOCKED
        priority:
          type: integer
          default: 100
        label:
          type: string
          default: ''
    Rule:
      type: object
      properties:
        id:
          type: string
          example: r_per_transaction_500
        rule_type:
          type: string
          enum:
          - per_transaction
          - daily_total
          - velocity
          - merchant_block
          - merchant_allow
          - category_limit
          - time_window
          - approval_threshold
          description: The rule check to apply.
        params:
          type: object
          description: Rule-type-specific parameters.
          example:
            max_amount: 500
        action:
          $ref: '#/components/schemas/Decision'
        priority:
          type: integer
          default: 100
          description: Higher priority rules are evaluated first. First BLOCK wins.
        enabled:
          type: boolean
          default: true
        label:
          type: string
          description: Optional human label used as the reason when the rule trips.
        agent_id:
          type:
          - string
          - 'null'
          description: Scope this rule to a specific agent. null = global.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: A checkout-issued or operator-created API key. ADMIN_TOKEN is accepted only for operator control-plane access.
externalDocs:
  description: Agent card (A2A discovery)
  url: https://sipi.bot/.well-known/agent-card.json
x-refined-from:
- sipi-openapi.json
- sipi-openapi.json
