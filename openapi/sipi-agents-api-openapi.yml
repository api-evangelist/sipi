openapi: 3.2.0
info:
  title: Sipi Agents API
  version: 0.1.0
  contact:
    name: sipi.bot
    url: https://sipi.bot
    email: sales@sipiteno.com
  license:
    name: MIT
    url: https://github.com/kindrat86/sipi-bot/blob/main/LICENSE
  termsOfService: https://sipi.bot/terms
  description: 'Operations tagged Agents across 2 of this provider''s published API definitions: sipi-openapi.json, sipi-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sipi.bot
  description: Production
security:
- BearerAuth: []
tags:
- name: Agents
  description: Register agents and issue API keys
paths:
  /api/agents:
    get:
      tags:
      - Agents
      summary: List registered agents
      operationId: listAgents
      responses:
        '200':
          description: Agents list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Agent'
    post:
      tags:
      - Agents
      summary: Register a new agent and get an API key
      operationId: registerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  example: billing-agent
      responses:
        '200':
          description: Created agent. The api_key is only returned here — store it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
    servers:
    - url: https://sipi.bot
      description: Production
components:
  schemas:
    Agent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: billing-agent
        api_key:
          type: string
          description: Bearer token for /v1/transactions/evaluate. Only returned once, at creation.
        created_at:
          type: string
          format: date-time
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: A checkout-issued or operator-created API key. ADMIN_TOKEN is accepted only for operator control-plane access.
externalDocs:
  description: Agent card (A2A discovery)
  url: https://sipi.bot/.well-known/agent-card.json
x-refined-from:
- sipi-openapi.json
- sipi-openapi.json
